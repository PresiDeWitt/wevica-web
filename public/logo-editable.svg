<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Stock Sync Pro">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Icono: cuadrado redondeado con gradiente -->
  <rect x="0" y="4" width="40" height="40" rx="10" ry="10" fill="url(#bgGrad)"/>

  <!-- Círculo semitransparente -->
  <circle cx="20" cy="24" r="15" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Checkmark -->
  <path d="M12 24l7.5 7.5 17.5-17.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Texto: Stock Sync Pro -->
  <text x="52" y="30" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="url(#textGrad)">Stock Sync Pro</text>
</svg>
